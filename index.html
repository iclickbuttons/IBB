<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBB · ICB Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0c0d0f;
    --bg2: #141518;
    --bg3: #1c1e22;
    --bg4: #242629;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #f0f0f0;
    --muted: #7a7d85;
    --muted2: #545760;
    --orange: #ff6b35;
    --orange-dim: rgba(255,107,53,0.12);
    --orange-dim2: rgba(255,107,53,0.06);
    --green: #22c55e;
    --green-dim: rgba(34,197,94,0.1);
    --blue: #60a5fa;
    --blue-dim: rgba(96,165,250,0.1);
    --purple: #a78bfa;
    --purple-dim: rgba(167,139,250,0.1);
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  header {
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: rgba(12,13,15,0.92);
    backdrop-filter: blur(12px);
    z-index: 100;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .wordmark {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text);
  }

  .wordmark span {
    color: var(--orange);
  }

  .chain-badge {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.04em;
  }

  .refresh-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--border2);
    color: var(--muted);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }
  .refresh-btn:hover { border-color: var(--orange); color: var(--orange); }
  .refresh-btn svg { width: 12px; height: 12px; transition: transform 0.4s; }
  .refresh-btn.spinning svg { animation: spin 0.6s linear; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Main layout */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2.5rem 2rem 4rem;
  }

  /* Token cards row */
  .token-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .token-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .token-card:hover { border-color: var(--border2); }

  .token-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--orange);
    opacity: 0.7;
  }

  .token-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .token-identity {
    display: flex;
    align-items: center;
    gap: 10px;
  }


  .token-name-block h2 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  .token-name-block p {
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
    margin-top: 1px;
  }

  .dex-link {
    font-size: 11px;
    color: var(--muted2);
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 6px;
    text-decoration: none;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.02em;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .dex-link:hover { color: var(--orange); border-color: var(--orange-dim); }
  .dex-link svg { width: 9px; height: 9px; margin-left: 3px; vertical-align: 0; }

  .token-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-top: 0.5rem;
  }

  .stat-item {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.75rem 1rem;
  }

  .stat-label {
    font-size: 10px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }

  .stat-value {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    font-family: 'DM Mono', monospace;
  }

  .stat-value.loading { color: var(--muted2); }

  /* Metrics strip */
  .metrics-strip {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .metric-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    transition: border-color 0.2s;
  }
  .metric-card:hover { border-color: var(--border2); }

  .metric-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 18px;
  }

  .metric-icon-fire { background: var(--orange-dim); }
  .metric-icon-holders { background: var(--blue-dim); }
  .metric-icon-rewards { background: var(--green-dim); }

  .metric-content {}
  .metric-content .metric-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .metric-content .metric-val {
    font-size: 22px;
    font-weight: 600;
    font-family: 'DM Mono', monospace;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  /* Bottom row */
  .bottom-row {
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 1rem;
  }

  /* Wallet card */
  .wallet-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
  }

  .section-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label::before {
    content: '';
    display: inline-block;
    width: 3px;
    height: 12px;
    background: var(--orange);
    border-radius: 2px;
  }

  .wallet-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 1rem;
  }

  .wallet-input {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 8px 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .wallet-input::placeholder { color: var(--muted2); }
  .wallet-input:focus { border-color: var(--orange); }

  .check-btn {
    background: var(--orange);
    border: none;
    border-radius: var(--radius-sm);
    color: #fff;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 16px;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .check-btn:hover { opacity: 0.85; }

  .rewards-result {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 1rem 1.25rem;
  }

  .rewards-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .rewards-value {
    font-size: 20px;
    font-weight: 600;
    font-family: 'DM Mono', monospace;
    color: var(--green);
  }

  /* Supply chart card */
  .supply-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
  }

  .supply-bars {
    margin-top: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .supply-row {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .supply-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .supply-name {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .supply-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .supply-pct {
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
  }

  .bar-track {
    height: 6px;
    background: var(--bg4);
    border-radius: 3px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .supply-amount {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted2);
    text-align: right;
    margin-top: 1px;
  }

  /* Last updated */
  .footer {
    margin-top: 2rem;
    text-align: center;
    font-size: 11px;
    color: var(--muted2);
    letter-spacing: 0.04em;
  }

  /* Pulse animation for loading */
  .pulse {
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  @media (max-width: 700px) {
    .token-row { grid-template-columns: 1fr; }
    .metrics-strip { grid-template-columns: 1fr; }
    .bottom-row { grid-template-columns: 1fr; }
    main { padding: 1.5rem 1rem 3rem; }
    header { padding: 0 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="wordmark">IBB <span>·</span> ICB</span>
    <span class="chain-badge">PulseChain</span>
  </div>

    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

<main>

  <!-- Token cards -->
  <div class="token-row">

        <div class="token-identity">

              <radialGradient id="ibb-bezel" cx="40%" cy="30%" r="70%"><stop offset="0%" stop-color="#333"/><stop offset="100%" stop-color="#080808"/></radialGradient>

              <radialGradient id="ibb-glow" cx="50%" cy="60%" r="55%"><stop offset="0%" stop-color="#FF4400" stop-opacity="0.8"/><stop offset="100%" stop-color="#FF2200" stop-opacity="0"/></radialGradient>

              <g transform="translate(35,61)"><polygon points="0,0 1,12 4,9 6,14 8,13 6,8 9,8" fill="#ffffff"/></g>
            </g>
          </svg>
          <div class="token-name-block">
            <h2>IBB</h2>
            <p>I Burn Buttons</p>
          </div>
        </div>
        <a class="dex-link" href="https://dexscreener.com/pulsechain/0x727bDF340CD00d5638704A7c05A88b2E485ceF6E" target="_blank">

          <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 8.5l7-7M8.5 8.5V1.5H1.5"/></svg>

    <div class="token-card">

  <!-- Metrics strip -->

  <!-- Bottom row -->
  <div class="bottom-row">

    <!-- Wallet -->
    <div class="wallet-card">
      <div class="section-label">My Wallet</div>

        <input class="wallet-input" id="walletInput" type="text" placeholder="0x…" />

              Circulating

      </div>

</main>

<script>
  const IBB_PAIR  = '0x727bDF340CD00d5638704A7c05A88b2E485ceF6E';
  const ICB_PAIR  = '0xF8F13B828B290d87b1a33961Ad5FF3C00b3A2A27';
  const ICB_TOKEN = '0xF8F13B828B290d87b1a33961Ad5FF3C00b3A2A27';
  const BURN_ADDR = '0x0000000000000000000000000000000000000000';
  const CHAIN     = 'pulsechain';

  const RPC = 'https://rpc.pulsechain.com';
  const DEXSCREENER = 'https://api.dexscreener.com/latest/dex/pairs/pulsechain/';

  function fmt(n, decimals = 4) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    return Number(n).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }

  function fmtBig(n) {
    if (!n || isNaN(n)) return '—';
    if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(2) + 'K';
    return n.toFixed(2);
  }

  function setEl(id, val) {
    const el = document.getElementById(id);
    if (el) { el.textContent = val; el.classList.remove('pulse', 'loading'); }
  }

  async function fetchDex(pair) {
    try {
      const r = await fetch(DEXSCREENER + pair);
      const d = await r.json();
      return d?.pairs?.[0] || null;
    } catch { return null; }
  }

  async function rpcCall(method, params) {
    try {
      const r = await fetch(RPC, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params })
      });
      const d = await r.json();
      return d.result;
    } catch { return null; }
  }

  async function getTokenBalance(token, address) {
    const data = '0x70a08231000000000000000000000000' + address.slice(2).padStart(64, '0');
    const result = await rpcCall('eth_call', [{ to: token, data }, 'latest']);
    if (!result) return null;
    return parseInt(result, 16) / 1e18;
  }

  let ibbData = null, icbData = null;

  async function fetchAll() {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('spinning');
    btn.textContent = 'Refreshing';

    // DEX data
    [ibbData, icbData] = await Promise.all([
      fetchDex(IBB_PAIR),
      fetchDex(ICB_PAIR)
    ]);

    if (ibbData) {
      setEl('ibb-price', '$' + fmt(ibbData.priceUsd, 6));
      const ch = parseFloat(ibbData.priceChange?.h24 || 0);
      const el = document.getElementById('ibb-change');
      if (el) {
        el.textContent = (ch >= 0 ? '+' : '') + ch.toFixed(2) + '%';
        el.style.color = ch >= 0 ? '#22c55e' : '#f87171';
        el.classList.remove('pulse', 'loading');
      }
    }

    if (icbData) {
      setEl('icb-price', '$' + fmt(icbData.priceUsd, 8));
      const ch = parseFloat(icbData.priceChange?.h24 || 0);
      const el = document.getElementById('icb-change');
      if (el) {
        el.textContent = (ch >= 0 ? '+' : '') + ch.toFixed(2) + '%';
        el.style.color = ch >= 0 ? '#22c55e' : '#f87171';
        el.classList.remove('pulse', 'loading');
      }

      // On-chain supply data from DEX
      const totalSupply = parseFloat(icbData.fdv || 0) / parseFloat(icbData.priceUsd || 1);
      const liqBurned = parseFloat(icbData.liquidity?.base || 0);
    }

    // On-chain: burned supply
    const burned = await getTokenBalance(ICB_TOKEN, BURN_ADDR);
    if (burned !== null) {
      setEl('icb-burned', fmtBig(burned) + ' ICB');

      // Hard-coded pre-IBB from contract (adjust as needed)
      const preIBB = 50_000_000;
      const totalMinted = 1_000_000_000;
      const circulating = totalMinted - preIBB - burned;

      const totalForPct = totalMinted;
      const pctPre = (preIBB / totalForPct * 100).toFixed(1);
      const pctBurned = (burned / totalForPct * 100).toFixed(1);
      const pctCirc = (circulating / totalForPct * 100).toFixed(1);

      setEl('pct-pre', pctPre + '%');
      setEl('pct-burned', pctBurned + '%');
      setEl('pct-circ', pctCirc + '%');
      setEl('amt-pre', fmtBig(preIBB) + ' ICB');
      setEl('amt-burned', fmtBig(burned) + ' ICB');
      setEl('amt-circ', fmtBig(circulating > 0 ? circulating : 0) + ' ICB');

      setTimeout(() => {
        const bPre = document.getElementById('bar-pre');
        const bBurned = document.getElementById('bar-burned');
        const bCirc = document.getElementById('bar-circ');
        if (bPre) bPre.style.width = pctPre + '%';
        if (bBurned) bBurned.style.width = pctBurned + '%';
        if (bCirc) bCirc.style.width = pctCirc + '%';
      }, 100);
    }

    // Holders & rewards from dex or static placeholder
    if (icbData) {
      const holders = icbData.holders || icbData.info?.holders || null;
      setEl('holders', holders ? holders.toLocaleString() : '—');
    }
    setEl('rewards-paid', '—');

    const now = new Date();
    document.getElementById('last-updated').textContent =
      'Last updated ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

    btn.classList.remove('spinning');
    btn.innerHTML = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8A5.5 5.5 0 1 1 8 2.5h3.5M13.5 2.5v4h-4"/></svg> Refresh`;
  }

  async function checkWallet() {
    const addr = document.getElementById('walletInput').value.trim();
    if (!addr || !addr.startsWith('0x')) {
      document.getElementById('wallet-rewards').textContent = 'Invalid address';
      return;
    }
    document.getElementById('wallet-rewards').textContent = '…';
    const bal = await getTokenBalance(ICB_TOKEN, addr);
    if (bal !== null) {
      document.getElementById('wallet-rewards').textContent = fmtBig(bal) + ' ICB';
    } else {
      document.getElementById('wallet-rewards').textContent = 'Error';
    }
  }

  document.getElementById('walletInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkWallet();
  });

  fetchAll();
</script>
</body>
</html>
