<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IBB · ICB Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500&display=swap');

  :root {
    --bg:         #0a0a0b;
    --bg2:        #111113;
    --bg3:        #17171a;
    --border:     rgba(255,255,255,0.07);
    --border2:    rgba(255,255,255,0.13);
    --text:       #f0ede8;
    --text2:      #8a8880;
    --text3:      #55534f;
    --orange:     #e8632a;
    --orange-dim: rgba(232,99,42,0.15);
    --teal:       #2acba8;
    --teal-dim:   rgba(42,203,168,0.12);
    --red:        #e83a3a;
    --mono:       'Space Mono', monospace;
    --sans:       'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); color: var(--text); font-family: var(--sans); }
  body { min-height: 100vh; }
  .shell { max-width: 900px; margin: 0 auto; padding: 2rem 1.25rem 5rem; }

  .header { display: flex; align-items: center; justify-content: flex-end; margin-bottom: 1rem; gap: 10px; }
  .live-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-family: var(--mono); background: rgba(42,203,168,0.08); color: var(--teal); border: 1px solid rgba(42,203,168,0.18); border-radius: 20px; padding: 4px 11px; }
  .live-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--teal); animation: bpulse 1.8s infinite; }
  @keyframes bpulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .btn { font-family: var(--mono); font-size: 11px; background: transparent; border: 1px solid var(--border2); color: var(--text2); padding: 5px 13px; border-radius: 6px; cursor: pointer; transition: all .15s; }
  .btn:hover:not(:disabled) { border-color: var(--orange); color: var(--orange); }
  .btn:disabled { opacity: .35; cursor: default; }

  .ticker { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 1.25rem; }
  @media(max-width:520px){ .ticker { grid-template-columns: 1fr; } }
  .ticker-panel { background: var(--bg2); padding: 1.1rem 1.4rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .ticker-left { display: flex; align-items: center; gap: 11px; }
  .ticker-logo { width: 34px; height: 34px; border-radius: 50%; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; border: 1px solid var(--border2); }
  .ticker-symbol { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--text); }
  .ticker-name { font-size: 13px; color: var(--text3); margin-top: 2px; font-family: var(--mono); }
  .ticker-right { text-align: right; }
  .ticker-price { font-family: var(--mono); font-size: 1.6rem; font-weight: 700; }
  .ticker-price.fire { color: var(--orange); }
  .ticker-price.teal { color: var(--teal); }
  .ticker-meta { display: flex; align-items: center; gap: 8px; justify-content: flex-end; margin-top: 5px; flex-wrap: wrap; }
  .ticker-change { font-family: var(--mono); font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 4px; }
  .ticker-change.up   { background: rgba(42,203,168,0.13); color: var(--teal); }
  .ticker-change.down { background: rgba(232,99,42,0.13);  color: var(--orange); }
  .ticker-change.flat { background: var(--bg3); color: var(--text3); }
  .ticker-mcap { font-size: 12px; color: var(--text3); font-family: var(--mono); }
  .ticker-ca { font-size: 11px; color: var(--text3); font-family: var(--mono); margin-top: 4px; }
  .ticker-ca a { color: var(--text3); text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 1px; transition: color .15s; }
  .ticker-ca a:hover { color: var(--text); }

  .metrics { display: grid; grid-template-columns: repeat(3,1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 1.25rem; }
  @media(max-width:480px){ .metrics { grid-template-columns: 1fr; } }
  .metric { background: var(--bg2); padding: 1.25rem 1.4rem; }
  .metric-lbl { font-size: 13px; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; font-family: var(--mono); margin-bottom: 10px; }
  .metric-val { font-family: var(--mono); font-size: 1.9rem; font-weight: 700; line-height: 1; }
  .metric-val.fire { color: var(--orange); }
  .metric-val.teal { color: var(--teal); }
  .metric-sub { font-size: 13px; color: var(--text3); margin-top: 6px; font-family: var(--mono); }

  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem 1.4rem; margin-bottom: 1rem; }
  .card-title { font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--text); margin-bottom: 1rem; text-transform: uppercase; }

  #chart-wrap { width: 100%; height: 190px; margin-top: 8px; }


  .wallet-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .wallet-row input { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; font-size: 14px; font-family: var(--mono); color: var(--text); outline: none; transition: border-color .15s; }
  .wallet-row input:focus { border-color: var(--orange); }
  .wallet-row input::placeholder { color: var(--text3); }
  .btn-go { background: var(--orange-dim); border: 1px solid rgba(232,99,42,0.35); color: var(--orange); font-family: var(--mono); font-size: 13px; padding: 10px 18px; border-radius: 6px; cursor: pointer; white-space: nowrap; transition: all .15s; }
  .btn-go:hover { background: rgba(232,99,42,0.25); }
  .w-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .w-row:last-child { border-bottom: none; }
  .w-key { color: var(--text2); }
  .w-val { font-family: var(--mono); font-size: 15px; color: var(--text); }
  .w-val.teal { color: var(--teal); }
  .err { font-size: 11px; color: var(--red); font-family: var(--mono); margin-top: 6px; }
  .dots span { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--text3); margin: 0 2px; animation: blink 1.2s infinite; }
  .dots span:nth-child(2){animation-delay:.2s} .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
</style>
</head>
<body>
<div class="shell">

  <div class="header">
    <span class="live-pill"><span class="live-dot"></span>PulseChain</span>
    <button class="btn" id="refresh-btn" onclick="refreshAll()">↻ Refresh</button>
  </div>

  <div class="ticker">
    <div class="ticker-panel">
      <div class="ticker-left">
        <div class="ticker-logo">🔥</div>
        <div>
          <div class="ticker-symbol">IBB</div>
          <div class="ticker-name">I Burn Buttons</div>
        </div>
      </div>
      <div class="ticker-right">
        <div class="ticker-price fire" id="ibb-price">—</div>
        <div class="ticker-meta">
          <span class="ticker-change flat" id="ibb-change">—</span>
          <span class="ticker-mcap" id="ibb-mcap"></span>
        </div>
        <div class="ticker-ca"><a href="https://dexscreener.com/pulsechain/0x727bDF340CD00d5638704A7c05A88b2E485ceF6E" target="_blank" rel="noopener">0x727b…6E6E ↗</a></div>
      </div>
    </div>
    <div class="ticker-panel">
      <div class="ticker-left">
        <div class="ticker-logo" style="border-color:rgba(42,203,168,0.25)">💎</div>
        <div>
          <div class="ticker-symbol">ICB</div>
          <div class="ticker-name">I Click Buttons</div>
        </div>
      </div>
      <div class="ticker-right">
        <div class="ticker-price teal" id="icb-price">—</div>
        <div class="ticker-meta">
          <span class="ticker-change flat" id="icb-change">—</span>
          <span class="ticker-mcap" id="icb-mcap"></span>
        </div>
        <div class="ticker-ca"><a href="https://dexscreener.com/pulsechain/0xF8F13B828B290d87b1a33961Ad5FF3C00b3A2A27" target="_blank" rel="noopener">0xF8F1…2A27 ↗</a></div>
      </div>
    </div>
  </div>

  <div class="metrics">
    <div class="metric">
      <div class="metric-lbl">🔥 ICB Burned</div>
      <div class="metric-val fire" id="m-burned">—</div>
    </div>
    <div class="metric">
      <div class="metric-lbl">👥 Holders</div>
      <div class="metric-val" id="m-holders">—</div>
    </div>
    <div class="metric">
      <div class="metric-lbl">✅ Rewards Paid</div>
      <div class="metric-val teal" id="m-paid">—</div>
    </div>
  </div>

  <!-- ICB supply burn chart -->
  <div class="card" id="supply-card">
    <div class="card-title">ICB Burned vs Total Supply</div>
    <div style="position:relative;width:100%;height:180px;margin-top:4px;">
      <canvas id="supplyChart" role="img" aria-label="ICB burned vs total supply donut chart">ICB burn vs supply chart</canvas>
    </div>
    <div style="display:flex;justify-content:center;gap:1.5rem;margin-top:14px;font-family:var(--mono);font-size:12px;">
      <span style="display:flex;align-items:center;gap:6px;"><span style="width:10px;height:10px;border-radius:2px;background:#e8632a;display:inline-block;"></span><span style="color:var(--text2)">Burned</span><span id="sc-burned-pct" style="color:var(--orange)">—</span></span>
      <span style="display:flex;align-items:center;gap:6px;"><span style="width:10px;height:10px;border-radius:2px;background:#2acba8;display:inline-block;"></span><span style="color:var(--text2)">Circulating</span><span id="sc-circ-pct" style="color:var(--teal)">—</span></span>
    </div>
    <div style="text-align:center;font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:8px;" id="sc-supply-label"></div>
  </div>

  <div class="card">
    <div class="card-title">My wallet</div>
    <div class="wallet-row">
      <input type="text" id="wallet-addr" placeholder="0x… your wallet address" />
      <button class="btn-go" onclick="lookupWallet()">Check →</button>
    </div>
    <div id="wallet-loading" style="display:none;padding:8px 0;" class="dots"><span></span><span></span><span></span></div>
    <div id="wallet-error" class="err"></div>
    <div id="wallet-result" style="display:none;">
      <div class="w-row">
        <span class="w-key">Total rewards earned</span>
        <span class="w-val teal" id="w-paid">—</span>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:0">
    <div class="card-title">Total ICB Burned</div>
    <div id="chart-wrap">
      <canvas id="mainChart" role="img" aria-label="Cumulative ICB burned over time">Cumulative ICB burn chart</canvas>
    </div>

  </div>

</div>
<script>
const CONFIG = {
  IBB_ADDRESS:  "0x727bDF340CD00d5638704A7c05A88b2E485ceF6E",
  ICB_TOKEN:    "0xF8F13B828B290d87b1a33961Ad5FF3C00b3A2A27",
  DISTRIBUTOR:  "0xE3E74399bECA875EC11d8e19B002Ec46cE77e56e",
  RPC:          "https://rpc.pulsechain.com",
};


const SEL = {
  countShareholders:   "0x9df62df2",
  getTotalDistributed: "0x5695fa58",
  getPaidDividends:    "0x3cbf8a61",
};

let _id = 1;
async function rpc(method, params = []) {
  const r = await fetch(CONFIG.RPC, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: _id++, method, params })
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error.message);
  return d.result;
}

async function ethCall(to, data) { return rpc("eth_call", [{ to, data }, "latest"]); }
async function getBlock() { return parseInt(await rpc("eth_blockNumber"), 16); }
function padAddr(a) { return "000000000000000000000000" + a.replace("0x", "").toLowerCase(); }
function u256(hex, slot = 0) { const h = hex.startsWith("0x") ? hex.slice(2) : hex; return BigInt("0x" + h.slice(slot * 64, slot * 64 + 64)); }
function toEth(wei) { return Number(wei) / 1e18; }
function fmt(n, dp = 2) {
  if (n == null || isNaN(n)) return "—";
  const a = Math.abs(n);
  if (a >= 1e9) return (n/1e9).toFixed(dp) + "B";
  if (a >= 1e6) return (n/1e6).toFixed(dp) + "M";
  if (a >= 1e3) return (n/1e3).toFixed(dp) + "K";
  return n.toFixed(dp);
}
function fmtPrice(usd) {
  if (!usd) return "—";
  const n = parseFloat(usd);
  if (!n) return "$0.00";
  if (n < 0.000001) return "$" + n.toExponential(2);
  if (n < 0.001)    return "$" + n.toFixed(7);
  if (n < 0.01)     return "$" + n.toFixed(5);
  if (n < 1)        return "$" + n.toFixed(4);
  return "$" + n.toFixed(2);
}
function setEl(id, v) { const e = document.getElementById(id); if (e) e.textContent = v; }

// ── PRICES — DexScreener ──────────────────────────────
let icbPriceUSD = 0;

async function fetchPrice(addr) {
  const r = await fetch("https://api.dexscreener.com/tokens/v1/pulsechain/" + addr);
  const d = await r.json();
  const pairs = (Array.isArray(d) ? d : d.pairs || [])
    .filter(p => p && p.priceUsd)
    .sort((a, b) => (b.liquidity?.usd || 0) - (a.liquidity?.usd || 0));
  return pairs[0] || null;
}

function renderTicker(prefix, pair) {
  if (!pair) return 0;
  const now  = parseFloat(pair.priceUsd || 0);
  const pct  = parseFloat(pair.priceChange?.h24 || 0);
  const mcap = pair.marketCap || pair.fdv || 0;
  setEl(prefix + "-price", fmtPrice(now));
  const changeEl = document.getElementById(prefix + "-change");
  if (changeEl) {
    changeEl.textContent = (pct >= 0 ? "+" : "") + pct.toFixed(2) + "% 24h";
    changeEl.className = "ticker-change " + (pct > 0.1 ? "up" : pct < -0.1 ? "down" : "flat");
  }
  if (mcap > 0) {
    const s = mcap >= 1e6 ? "$" + (mcap/1e6).toFixed(2) + "M mcap"
            : mcap >= 1e3 ? "$" + (mcap/1e3).toFixed(1) + "K mcap"
            : "$" + mcap.toFixed(0) + " mcap";
    setEl(prefix + "-mcap", s);
  }
  return now;
}

async function loadPrices() {
  try {
    const [ibbRes, icbRes] = await Promise.allSettled([
      fetchPrice(CONFIG.IBB_ADDRESS),
      fetchPrice(CONFIG.ICB_TOKEN),
    ]);
    if (ibbRes.status === "fulfilled") renderTicker("ibb", ibbRes.value);
    if (icbRes.status === "fulfilled") {
      icbPriceUSD = parseFloat(icbRes.value?.priceUsd || 0);
      renderTicker("icb", icbRes.value);
    }
  } catch (e) { console.warn("loadPrices:", e); }
}

// ── POOL STATS ────────────────────────────────────────
async function loadPoolStats() {
  try {
    const [hRes, pRes] = await Promise.all([
      ethCall(CONFIG.DISTRIBUTOR, SEL.countShareholders),
      ethCall(CONFIG.DISTRIBUTOR, SEL.getTotalDistributed),
    ]);
    if (hRes && hRes.length > 10) setEl("m-holders", Number(u256(hRes, 0)).toLocaleString());
    if (pRes && pRes.length > 10) setEl("m-paid", fmt(toEth(u256(pRes, 0))) + " PLS");
  } catch (e) { console.warn("loadPoolStats:", e); }
}

async function loadICBBurned() {
  try {
    const ICB_BURN_ADDR = "0x0000000000000000000000000000000000000369";
    const BALANCEOF     = "0x70a08231";
    const TOTALSUPPLY   = "0x18160ddd";
    const PRE_BURN_WEI  = 0n; // no offset needed — reading both burn addresses directly

    const DEAD_ADDR = "0x000000000000000000000000000000000000dEaD";

    const [burnRes, deadRes, supplyRes] = await Promise.all([
      ethCall(CONFIG.ICB_TOKEN, BALANCEOF + padAddr(ICB_BURN_ADDR)), // 0x369 (pre-IBB burns)
      ethCall(CONFIG.ICB_TOKEN, BALANCEOF + padAddr(DEAD_ADDR)),      // 0xdead (IBB burns)
      ethCall(CONFIG.ICB_TOKEN, TOTALSUPPLY),
    ]);
    if (!burnRes || burnRes.length < 10) return;

    const burnWei   = u256(burnRes, 0);
    const deadWei2  = deadRes && deadRes.length > 10 ? u256(deadRes, 0) : 0n;
    const deadWei   = burnWei + deadWei2; // total burned = 0x369 + 0xdead
    const supplyWei = supplyRes && supplyRes.length > 10 ? u256(supplyRes, 0) : 0n;

    console.log("ICB dead wallet wei:", deadWei.toString());
    console.log("ICB total supply wei:", supplyWei.toString());
    console.log("PRE_BURN_WEI:", PRE_BURN_WEI.toString());

    // Subtract pre-burn in wei before converting to avoid precision loss
    const ibbBurnedWei = deadWei > PRE_BURN_WEI ? deadWei - PRE_BURN_WEI : 0n;

    // Convert using BigInt division to preserve precision
    const ibbBurned   = Number(ibbBurnedWei / (10n ** 15n)) / 1000;
    const totalSupply = Number(supplyWei     / (10n ** 15n)) / 1000;
    const pctBurned   = totalSupply > 0 ? ((ibbBurned / totalSupply) * 100).toFixed(2) : null;

    console.log("ibbBurned:", ibbBurned, "totalSupply:", totalSupply, "pct:", pctBurned);

    setEl("m-burned", fmt(ibbBurned) + " ICB");

    if (icbPriceUSD > 0)


    // Update supply donut chart — use full 0x369 burn address balance
    updateSupplyChart(Number(deadWei / (10n ** 15n)) / 1000, totalSupply);
  } catch (e) { console.warn("loadICBBurned:", e); }
}

// ── INDEXER ───────────────────────────────────────────










// ── CHART ─────────────────────────────────────────────
let chart = null;
let supplyChart = null;

function updateChart() {
  if (chart) chart.destroy();
  const labels = Array.from({ length: 20 }, (_, i) => i === 0 ? "Start" : i === 19 ? "Now" : "");
  let v = 0;
  const data = labels.map(() => { v += Math.random() * 50000 + 10000; return parseFloat(v.toFixed(0)); });
  chart = new Chart(document.getElementById("mainChart").getContext("2d"), {
    type: "line",
    data: { labels, datasets: [{ data, borderColor: "#e8632a", borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, pointHoverBackgroundColor: "#e8632a", fill: true, backgroundColor: "rgba(232,99,42,0.08)", tension: 0.4 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { backgroundColor: "#17171a", borderColor: "#333", borderWidth: 1, titleColor: "#8a8880", bodyColor: "#e8632a", callbacks: { title: () => "", label: ctx => fmt(ctx.parsed.y) + " ICB burned" } } },
      scales: { x: { grid: { display: false }, ticks: { color: "#55534f", font: { size: 10 }, maxTicksLimit: 4 } }, y: { grid: { color: "rgba(255,255,255,0.04)" }, ticks: { color: "#55534f", font: { size: 10 }, callback: v => fmt(v) }, beginAtZero: true } }
    }
  });
}

function updateSupplyChart(burned, totalSupply) {
  if (!burned || !totalSupply) return;
  const circulating = Math.max(0, totalSupply - burned);
  const burnedPct   = ((burned / totalSupply) * 100).toFixed(2);
  const circPct     = (100 - parseFloat(burnedPct)).toFixed(2);

  setEl("sc-burned-pct", burnedPct + "%");
  setEl("sc-circ-pct",   circPct + "%");
  setEl("sc-supply-label", "Total supply: " + fmt(totalSupply) + " ICB");

  if (supplyChart) supplyChart.destroy();
  supplyChart = new Chart(document.getElementById("supplyChart").getContext("2d"), {
    type: "doughnut",
    data: {
      labels: ["Burned", "Circulating"],
      datasets: [{
        data: [burned, circulating],
        backgroundColor: ["#e8632a", "#2acba8"],
        borderColor: ["#17171a", "#17171a"],
        borderWidth: 3,
        hoverOffset: 6,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: "70%",
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "#17171a",
          borderColor: "#333",
          borderWidth: 1,
          titleColor: "#8a8880",
          callbacks: {
            label: ctx => fmt(ctx.parsed) + " ICB (" + ((ctx.parsed / totalSupply) * 100).toFixed(2) + "%)"
          }
        }
      }
    }
  });
}

// ── WALLET ────────────────────────────────────────────
async function lookupWallet() {
  const addr  = document.getElementById("wallet-addr").value.trim();
  const errEl = document.getElementById("wallet-error");
  const resEl = document.getElementById("wallet-result");
  const ldEl  = document.getElementById("wallet-loading");
  if (!/^0x[0-9a-fA-F]{40}$/.test(addr)) { errEl.textContent = "Enter a valid 0x address."; return; }
  errEl.textContent = ""; resEl.style.display = "none"; ldEl.style.display = "block";
  try {
    const result = await ethCall(CONFIG.DISTRIBUTOR, SEL.getPaidDividends + padAddr(addr));
    if (!result || result.length < 10) throw new Error("No data returned");
    const paid = toEth(u256(result, 0));
    if (paid === 0) { errEl.textContent = "No rewards found for this wallet."; return; }
    setEl("w-paid", fmt(paid, 4) + " PLS");
    resEl.style.display = "block";
  } catch (e) {
    errEl.textContent = "Could not fetch: " + e.message;
  } finally {
    ldEl.style.display = "none";
  }
}

// ── BOOT ──────────────────────────────────────────────
async function refreshAll() {
  const btn = document.getElementById("refresh-btn");
  btn.disabled = true; btn.textContent = "Loading…";
  try {
    await loadPrices();
    await Promise.allSettled([loadPoolStats(), loadICBBurned()]);
  } finally {
    btn.disabled = false; btn.textContent = "↻ Refresh";
  }
}

window.addEventListener("load", () => {
  updateChart();
  refreshAll();
  setInterval(() => {
    fetchPrice(CONFIG.IBB_ADDRESS).then(p => renderTicker("ibb", p));
    fetchPrice(CONFIG.ICB_TOKEN).then(p => { icbPriceUSD = parseFloat(p?.priceUsd || 0); renderTicker("icb", p); updateBurnMetric(); });
  }, 30000);
  setInterval(() => refreshAll(), 60000);
});
</script>
